name: Deploy PitchLab Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-worker"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q backend/tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Typecheck and test Cloudflare Worker
        working-directory: worker
        run: |
          npm install
          npm run typecheck
          npm test

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare deployment secrets
        id: cf_secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping automated Worker deploy because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is not set. Deploy from worker/ via 'npx wrangler deploy' or configure those secrets for CI deploys."
          fi

      - name: Setup Node.js
        if: steps.cf_secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Worker dependencies
        if: steps.cf_secrets.outputs.configured == 'true'
        working-directory: worker
        run: npm install

      - name: Deploy Cloudflare Worker
        if: steps.cf_secrets.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

  deploy-pages:
    needs: [test, deploy-worker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build static Next.js export for GitHub Pages
        working-directory: frontend
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/pitchlab"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
